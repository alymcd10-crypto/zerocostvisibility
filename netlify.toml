[build]
  # Copies site/ to dist/ and fills in the site address from site.config.json
  command = "node scripts/build.mjs"
  publish = "dist"

# Extra domains forward to the main one. These rules stay inactive until each domain is
# added to this Netlify project as a domain alias (Domain management > Add a domain alias).
# They must stay above every other redirect.
[[redirects]]
  from = "https://lizturnbaughfederman.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://lizturnbaughfederman.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lizturnbaughfederman.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.lizturnbaughfederman.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://lizfederman.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://lizfederman.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lizfederman.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.lizfederman.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.zerocostvisibility.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.zerocostvisibility.com/*"
  to = "https://zerocostvisibility.com/:splat"
  status = 301
  force = true

# Phase 1 shows only the 1:1 session. The Setup page is saved in phase2/ for later;
# old links to /setup land on the Book page.
[[redirects]]
  from = "/setup"
  to = "/book"
  status = 302

[[redirects]]
  from = "/toolkit"
  to = "/toolkit/"
  status = 301

# Short links printed as QR codes in Liz's deck (UTM tags show which slide drove the scan)
[[redirects]]
  from = "/starpower"
  to = "/toolkit/?utm_source=starpower&utm_medium=qr&utm_campaign=starpower2026&utm_content=closing-slide"
  status = 302

[[redirects]]
  from = "/reviews"
  to = "/toolkit/?utm_source=starpower&utm_medium=qr&utm_campaign=starpower2026&utm_content=slide14#step3"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Scripts and styles have no version in their names, so browsers must check for a new copy
# on every visit; otherwise a fix can take a week to reach returning visitors.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The toolkit is locked by netlify/edge-functions/toolkit-gate.ts. Never cache either version
# of /toolkit/ (locked or unlocked) in a shared cache, and keep both out of search results.
[[headers]]
  for = "/toolkit/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/attendee/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex"
